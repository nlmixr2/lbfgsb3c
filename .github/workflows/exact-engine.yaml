# Check that the C++ engine reproduces the Fortran engine bit for bit.
# This needs R's reference BLAS: the Fortran path calls R's LINPACK, which
# calls the system BLAS, and optimized BLAS libraries round differently.
on:
  push:
    branches: [main, master]
  # PR checks run only when a reviewer approves with the phrase
  # "ready to be merged" (pushes to a PR branch no longer start CI).
  pull_request_review:
    types: [submitted]
  # Maintainers can also start PR checks by commenting "/ci" on the PR.
  issue_comment:
    types: [created]

name: exact-engine

jobs:
  exact-engine:
    if: ((github.event_name != 'pull_request_review' && github.event_name != 'issue_comment') || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && contains(github.event.review.body, 'ready to be merged') && contains(fromJSON('["main","master"]'), github.event.pull_request.base.ref)) || (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/ci') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      LBFGSB3C_EXACT_ENGINE_TEST: true

    steps:
      - name: Report /ci run to the PR (pending)
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        env:
          CI_CONTEXT: exact-engine
        with:
          script: |
            const pr = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
            core.exportVariable('CI_PR_HEAD_SHA', pr.data.head.sha);
            await github.rest.repos.createCommitStatus({ ...context.repo, sha: pr.data.head.sha,
              state: 'pending', context: process.env.CI_CONTEXT, description: '/ci run in progress',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/merge', github.event.issue.number) || '' }}

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Use the reference BLAS
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas3 liblapack3
          sudo update-alternatives --set libblas.so.3-x86_64-linux-gnu \
            /usr/lib/x86_64-linux-gnu/blas/libblas.so.3
          sudo update-alternatives --set liblapack.so.3-x86_64-linux-gnu \
            /usr/lib/x86_64-linux-gnu/lapack/liblapack.so.3

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, local::.
          needs: check

      - name: Run tests with exact engine comparison
        run: |
          si <- sessionInfo()
          cat("BLAS:", si$BLAS, "\nLAPACK:", si$LAPACK, "\n")
          testthat::test_local(".", reporter = "summary", stop_on_failure = TRUE)
        shell: Rscript {0}

      - name: Report /ci run to the PR (result)
        if: always() && github.event_name == 'issue_comment' && env.CI_PR_HEAD_SHA != ''
        uses: actions/github-script@v7
        env:
          CI_CONTEXT: exact-engine
          CI_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const s = process.env.CI_JOB_STATUS;
            const state = s === 'success' ? 'success' : s === 'failure' ? 'failure' : 'error';
            await github.rest.repos.createCommitStatus({ ...context.repo, sha: process.env.CI_PR_HEAD_SHA,
              state, context: process.env.CI_CONTEXT, description: `/ci run: ${s}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
